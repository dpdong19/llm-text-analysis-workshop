<svg viewBox="0 0 960 370" xmlns="http://www.w3.org/2000/svg" role="img" style="font-family: 'Inter', -apple-system, sans-serif;">
  <title>LLM API classification workflow</title>
  <desc>Left-to-right flow: Dataset, Package Request (with prompt, taxonomy, schema), LLM API, Validate and Save, Outputs. Loop arrow shows repeat for each row.</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8a0b4"/>
    </marker>
  </defs>

  <!-- ========== 1. DATASET ========== -->
  <rect x="15" y="75" width="130" height="170" rx="10" fill="#e8e4e0" stroke="#b8b0a8" stroke-width="1.2"/>
  <text x="80" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#5a534d">Dataset</text>
  <text x="80" y="120" text-anchor="middle" font-size="10" fill="#8a837d">50 reviews</text>
  <!-- mini rows -->
  <rect x="28" y="134" width="104" height="16" rx="3" fill="#f5f3f0" stroke="#cec8c2" stroke-width="0.6"/>
  <text x="35" y="145" font-size="8.5" fill="#6b6560">AR001  "Sofia to Zap..."</text>
  <rect x="28" y="154" width="104" height="16" rx="3" fill="#f5f3f0" stroke="#cec8c2" stroke-width="0.6"/>
  <text x="35" y="165" font-size="8.5" fill="#6b6560">AR002  "Flew from Pe..."</text>
  <rect x="28" y="174" width="104" height="16" rx="3" fill="#f5f3f0" stroke="#cec8c2" stroke-width="0.6"/>
  <text x="35" y="185" font-size="8.5" fill="#6b6560">AR003  "New York to..."</text>
  <text x="80" y="215" text-anchor="middle" font-size="10" fill="#cec8c2">. . .</text>
  <text x="80" y="235" text-anchor="middle" font-size="8.5" fill="#8a837d">AR050</text>

  <!-- Arrow 1 -->
  <line x1="145" y1="160" x2="205" y2="160" stroke="#a8a0b4" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="175" y="150" text-anchor="middle" font-size="8.5" fill="#a8a0b4">one row</text>

  <!-- ========== 2. PACKAGE REQUEST ========== -->
  <rect x="205" y="55" width="175" height="215" rx="10" fill="#e5e0e8" stroke="#b0a8b8" stroke-width="1.2"/>
  <text x="292" y="82" text-anchor="middle" font-size="13" font-weight="700" fill="#524d58">Your Code</text>
  <text x="292" y="100" text-anchor="middle" font-size="10" fill="#8a8490">package the request</text>

  <!-- sub-items -->
  <text x="292" y="122" text-anchor="middle" font-size="10" fill="#6b6570">review text  +</text>

  <rect x="222" y="132" width="140" height="22" rx="5" fill="#f5f3f7" stroke="#c4bece" stroke-width="0.8"/>
  <text x="292" y="147" text-anchor="middle" font-size="10" font-weight="500" fill="#524d58">prompt (instructions)</text>

  <rect x="222" y="158" width="140" height="22" rx="5" fill="#f5f3f7" stroke="#c4bece" stroke-width="0.8"/>
  <text x="292" y="173" text-anchor="middle" font-size="10" font-weight="500" fill="#524d58">taxonomy (topics)</text>

  <rect x="222" y="184" width="140" height="22" rx="5" fill="#f5f3f7" stroke="#c4bece" stroke-width="0.8"/>
  <text x="292" y="199" text-anchor="middle" font-size="10" font-weight="500" fill="#524d58">schema (format)</text>

  <text x="292" y="230" text-anchor="middle" font-size="9" fill="#b0a8b8">same for every row</text>

  <!-- Arrow 2 -->
  <line x1="380" y1="160" x2="440" y2="160" stroke="#a8a0b4" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="410" y="150" text-anchor="middle" font-size="8.5" fill="#a8a0b4">request</text>

  <!-- ========== 3. LLM API ========== -->
  <rect x="440" y="95" width="145" height="130" rx="10" fill="#ebe0e4" stroke="#c0a8b0" stroke-width="1.2"/>
  <text x="512" y="130" text-anchor="middle" font-size="13" font-weight="700" fill="#5a4d52">LLM API</text>
  <text x="512" y="155" text-anchor="middle" font-size="10" fill="#8a7d82">classifies the review</text>
  <text x="512" y="175" text-anchor="middle" font-size="10" fill="#8a7d82">returns structured</text>
  <text x="512" y="192" text-anchor="middle" font-size="10" fill="#8a7d82">JSON result</text>

  <!-- Arrow 3 -->
  <line x1="585" y1="160" x2="645" y2="160" stroke="#a8a0b4" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="615" y="150" text-anchor="middle" font-size="8.5" fill="#a8a0b4">response</text>

  <!-- ========== 4. VALIDATE & SAVE ========== -->
  <rect x="645" y="95" width="145" height="130" rx="10" fill="#e5e0e8" stroke="#b0a8b8" stroke-width="1.2"/>
  <text x="717" y="127" text-anchor="middle" font-size="13" font-weight="700" fill="#524d58">Your Code</text>
  <text x="717" y="150" text-anchor="middle" font-size="10" fill="#8a8490">validate result</text>
  <text x="717" y="170" text-anchor="middle" font-size="10" fill="#8a8490">save or log error</text>

  <!-- Arrow 4 -->
  <line x1="790" y1="160" x2="850" y2="160" stroke="#a8a0b4" stroke-width="1.3" marker-end="url(#arr)"/>

  <!-- ========== 5. OUTPUTS ========== -->
  <rect x="850" y="105" width="95" height="110" rx="10" fill="#e8e4ea" stroke="#b0a8b8" stroke-width="1.2"/>
  <text x="897" y="135" text-anchor="middle" font-size="12" font-weight="600" fill="#524d58">Outputs</text>
  <text x="897" y="160" text-anchor="middle" font-size="10" fill="#6b8a6b" font-weight="500">results.csv</text>
  <text x="897" y="180" text-anchor="middle" font-size="10" fill="#8a6b6b" font-weight="500">errors.csv</text>

  <!-- ========== LOOP ARROW ========== -->
  <path d="M 717 225 C 717 310, 400 330, 80 310 C 40 305, 25 280, 30 250" stroke="#a8a0b4" stroke-width="1.3" fill="none" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text x="400" y="320" text-anchor="middle" font-size="11" font-weight="600" fill="#a8a0b4">repeat for each row</text>

</svg>
