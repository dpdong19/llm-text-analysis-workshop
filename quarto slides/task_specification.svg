<svg viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img" style="font-family: 'Inter', -apple-system, sans-serif;">
  <title>What do we send to the model?</title>
  <desc>Three cards showing prompt, taxonomy, and schema, converging into a single request sent to the LLM API.</desc>

  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a8a0b4"/>
    </marker>
  </defs>

  <text x="450" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#4a4a4a">What do we send to the model?</text>

  <rect x="30" y="65" width="250" height="175" rx="12" fill="#e8e4e0" stroke="#b8b0a8" stroke-width="1.2"/>
  <circle cx="70" cy="100" r="18" fill="#b8b0a8"/>
  <text x="70" y="106" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">P</text>
  <text x="100" y="100" font-size="15" font-weight="700" fill="#5a534d">Prompt</text>
  <text x="100" y="118" font-size="10" fill="#8a837d">classification instructions</text>
  <line x1="45" y1="132" x2="265" y2="132" stroke="#cec8c2" stroke-width="0.8"/>
  <text x="50" y="155" font-size="10.5" fill="#6b6560" font-style="italic">"Read this review.</text>
  <text x="50" y="172" font-size="10.5" fill="#6b6560" font-style="italic">Identify which topics are</text>
  <text x="50" y="189" font-size="10.5" fill="#6b6560" font-style="italic">discussed and the sentiment</text>
  <text x="50" y="206" font-size="10.5" fill="#6b6560" font-style="italic">for each."</text>

  <rect x="320" y="65" width="250" height="175" rx="12" fill="#e5e0e8" stroke="#b0a8b8" stroke-width="1.2"/>
  <circle cx="360" cy="100" r="18" fill="#b0a8b8"/>
  <text x="360" y="106" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">T</text>
  <text x="390" y="100" font-size="15" font-weight="700" fill="#524d58">Taxonomy</text>
  <text x="390" y="118" font-size="10" fill="#8a8490">allowed topic categories</text>
  <line x1="335" y1="132" x2="555" y2="132" stroke="#cec8d2" stroke-width="0.8"/>
  <rect x="340" y="145" width="95" height="22" rx="11" fill="#f5f3f7" stroke="#c4bece" stroke-width="0.8"/>
  <text x="387" y="160" text-anchor="middle" font-size="9.5" fill="#5a5460">cabin service</text>
  <rect x="445" y="145" width="95" height="22" rx="11" fill="#f5f3f7" stroke="#c4bece" stroke-width="0.8"/>
  <text x="492" y="160" text-anchor="middle" font-size="9.5" fill="#5a5460">seat comfort</text>
  <rect x="340" y="175" width="115" height="22" rx="11" fill="#f5f3f7" stroke="#c4bece" stroke-width="0.8"/>
  <text x="397" y="190" text-anchor="middle" font-size="9.5" fill="#5a5460">food &amp; beverage</text>
  <rect x="465" y="175" width="95" height="22" rx="11" fill="#f5f3f7" stroke="#c4bece" stroke-width="0.8"/>
  <text x="512" y="190" text-anchor="middle" font-size="9.5" fill="#5a5460">entertainment</text>
  <rect x="340" y="205" width="110" height="22" rx="11" fill="#f5f3f7" stroke="#c4bece" stroke-width="0.8"/>
  <text x="395" y="220" text-anchor="middle" font-size="9.5" fill="#5a5460">value for money</text>
  <text x="465" y="220" font-size="11" fill="#c4bece">...</text>

  <rect x="610" y="65" width="250" height="175" rx="12" fill="#ebe0e4" stroke="#c0a8b0" stroke-width="1.2"/>
  <circle cx="650" cy="100" r="18" fill="#c0a8b0"/>
  <text x="650" y="106" text-anchor="middle" font-size="13" fill="#fff" font-weight="600">{ }</text>
  <text x="680" y="100" font-size="15" font-weight="700" fill="#5a4d52">Schema</text>
  <text x="680" y="118" font-size="10" fill="#8a7d82">required output format</text>
  <line x1="625" y1="132" x2="845" y2="132" stroke="#d4c8cc" stroke-width="0.8"/>
  <text x="635" y="153" font-size="10" fill="#7a7075" font-family="'Fira Code', 'Consolas', monospace">{</text>
  <text x="648" y="170" font-size="10" fill="#7a7075" font-family="'Fira Code', 'Consolas', monospace">"review_id": "AR001",</text>
  <text x="648" y="187" font-size="10" fill="#7a7075" font-family="'Fira Code', 'Consolas', monospace">"classifications": [</text>
  <text x="662" y="204" font-size="10" fill="#6b5560" font-family="'Fira Code', 'Consolas', monospace">{ "topic": "...",</text>
  <text x="669" y="221" font-size="10" fill="#6b5560" font-family="'Fira Code', 'Consolas', monospace">"sentiment": "..." }</text>
  <text x="648" y="235" font-size="10" fill="#7a7075" font-family="'Fira Code', 'Consolas', monospace">]</text>

  <line x1="155" y1="240" x2="400" y2="310" stroke="#a8a0b4" stroke-width="1.3" marker-end="url(#arr3)"/>
  <line x1="445" y1="240" x2="440" y2="310" stroke="#a8a0b4" stroke-width="1.3" marker-end="url(#arr3)"/>
  <line x1="735" y1="240" x2="490" y2="310" stroke="#a8a0b4" stroke-width="1.3" marker-end="url(#arr3)"/>

  <text x="450" y="290" text-anchor="middle" font-size="11" font-weight="600" fill="#a8a0b4">These stay the same for every review</text>

  <rect x="350" y="310" width="190" height="55" rx="10" fill="#e8e4ea" stroke="#b0a8b8" stroke-width="1.2"/>
  <text x="445" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#524d58">One API request</text>
  <text x="445" y="355" text-anchor="middle" font-size="10" fill="#8a8490">review text + all three above</text>

  <line x1="540" y1="338" x2="620" y2="338" stroke="#a8a0b4" stroke-width="1.3" marker-end="url(#arr3)"/>

  <rect x="620" y="310" width="130" height="55" rx="10" fill="#ebe0e4" stroke="#c0a8b0" stroke-width="1.2"/>
  <text x="685" y="337" text-anchor="middle" font-size="13" font-weight="700" fill="#5a4d52">LLM API</text>
  <text x="685" y="355" text-anchor="middle" font-size="10" fill="#8a7d82">classify</text>
</svg>
