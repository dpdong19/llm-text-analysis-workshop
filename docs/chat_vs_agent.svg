<svg viewBox="0 0 880 400" xmlns="http://www.w3.org/2000/svg" role="img" style="font-family: 'Inter', -apple-system, sans-serif;">
  <title>Chat assistant vs Coding agent</title>
  <desc>Two-panel comparison. Left: chat assistant as a conversation bubble exchange. Right: coding agent as a figure with a toolbox working on files.</desc>

  <!-- ========== LEFT: CHAT ========== -->
  <rect x="20" y="15" width="400" height="370" rx="14" fill="#e8e4e0" stroke="#b8b0a8" stroke-width="1.2"/>
  <text x="220" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#5a534d">Chat assistant</text>
  <text x="220" y="72" text-anchor="middle" font-size="11" fill="#8a837d">ChatGPT, Claude</text>

  <!-- Person icon -->
  <circle cx="70" cy="125" r="16" fill="#c8c0b8"/>
  <text x="70" y="131" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">You</text>

  <!-- Chat bubbles -->
  <rect x="95" y="110" width="200" height="32" rx="12" fill="#f5f3f0" stroke="#cec8c2" stroke-width="0.8"/>
  <text x="108" y="130" font-size="10.5" fill="#5a534d">"How do I classify these reviews?"</text>

  <!-- AI reply -->
  <circle cx="350" cy="170" r="16" fill="#b0a8b8"/>
  <text x="350" y="176" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">AI</text>

  <rect x="105" y="155" width="235" height="32" rx="12" fill="#f0eef5" stroke="#c4bece" stroke-width="0.8"/>
  <text x="118" y="175" font-size="10.5" fill="#524d58">"You could use the OpenAI API with..."</text>

  <!-- You again -->
  <rect x="95" y="200" width="180" height="32" rx="12" fill="#f5f3f0" stroke="#cec8c2" stroke-width="0.8"/>
  <text x="108" y="220" font-size="10.5" fill="#5a534d">"Can you write the code?"</text>

  <!-- AI reply with code -->
  <rect x="105" y="245" width="270" height="48" rx="12" fill="#f0eef5" stroke="#c4bece" stroke-width="0.8"/>
  <text x="118" y="265" font-size="10.5" fill="#524d58">"Sure, here's a snippet:"</text>
  <text x="118" y="282" font-size="9.5" fill="#8a8490" font-family="'Fira Code', 'Consolas', monospace">response = client.chat.completions...</text>

  <!-- The punchline -->
  <rect x="55" y="315" width="330" height="50" rx="10" fill="#ddd8d4" stroke="#b8b0a8" stroke-width="0.8"/>
  <text x="220" y="337" text-anchor="middle" font-size="12" font-weight="600" fill="#5a534d">You talk, it talks back.</text>
  <text x="220" y="355" text-anchor="middle" font-size="10.5" fill="#8a837d">You still copy, paste, run, and debug yourself.</text>

  <!-- ========== RIGHT: AGENT ========== -->
  <rect x="460" y="15" width="400" height="370" rx="14" fill="#e5e0e8" stroke="#b0a8b8" stroke-width="1.2"/>
  <text x="660" y="52" text-anchor="middle" font-size="17" font-weight="700" fill="#524d58">Coding agent</text>
  <text x="660" y="72" text-anchor="middle" font-size="11" fill="#8a8490">Codex, Claude Code</text>

  <!-- Person gives instruction -->
  <circle cx="510" cy="110" r="16" fill="#c8c0b8"/>
  <text x="510" y="116" text-anchor="middle" font-size="14" fill="#fff" font-weight="600">You</text>
  <rect x="535" y="95" width="230" height="32" rx="12" fill="#f5f3f0" stroke="#cec8c2" stroke-width="0.8"/>
  <text x="548" y="115" font-size="10.5" fill="#5a534d">"Classify these 50 reviews for me."</text>

  <!-- Agent works: toolbox -->
  <circle cx="510" cy="175" r="16" fill="#b0a8b8"/>
  <text x="510" y="181" text-anchor="middle" font-size="11" fill="#fff" font-weight="600">AI</text>

  <!-- Tool actions - stacked -->
  <rect x="535" y="150" width="285" height="28" rx="8" fill="#f0eef5" stroke="#c4bece" stroke-width="0.8"/>
  <text x="548" y="168" font-size="10" fill="#524d58">Opens your project folder</text>

  <rect x="535" y="183" width="285" height="28" rx="8" fill="#f0eef5" stroke="#c4bece" stroke-width="0.8"/>
  <text x="548" y="201" font-size="10" fill="#524d58">Writes classify.py with prompt + schema</text>

  <rect x="535" y="216" width="285" height="28" rx="8" fill="#f0eef5" stroke="#c4bece" stroke-width="0.8"/>
  <text x="548" y="234" font-size="10" fill="#524d58">Runs it, sees an error, fixes it</text>

  <rect x="535" y="249" width="285" height="28" rx="8" fill="#f0eef5" stroke="#c4bece" stroke-width="0.8"/>
  <text x="548" y="267" font-size="10" fill="#524d58">Hands you results.csv</text>

  <!-- The punchline -->
  <rect x="495" y="315" width="330" height="50" rx="10" fill="#d8d0e0" stroke="#b0a8b8" stroke-width="0.8"/>
  <text x="660" y="337" text-anchor="middle" font-size="12" font-weight="600" fill="#524d58">You talk, it works.</text>
  <text x="660" y="355" text-anchor="middle" font-size="10.5" fill="#8a8490">A conversation with hands.</text>

</svg>
